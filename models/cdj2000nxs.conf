# CDJ-2000NXS, update v1.44 -- BRING-UP. The older platform it shares with the
# CDJ-2000: an SH-4A MAIN with its peripherals at 0xFFxxxxxx (not the NXS2's
# SH7724), a C672x-class DSP and a different GUI processor. The update has the
# NXS2's container layout; MAIN's LZSS stream starts at 0x40000, not 0x50000.
# No GUI board yet: MAIN boots alone.
MODEL_TITLE="CDJ-2000NXS"
MODEL_MAIN_MACHINE=cdj2000nxs
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj2000nxs

MODEL_FW_VERSION=1.44
MODEL_UPD="C2KNXS.UPD"
MODEL_UPD_SHA256="b17c0f715fb8dd4187f4857409a99c40a3708b383cc0d360a983d291ded81097"
MODEL_MAIN_SECTION=3
MODEL_GUI_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_FW_STEPS="sections srec_coverage lzss_decode gui_decode"

# The display board (a Blackfin) runs inside the MAIN emulator and loads its
# program from this update file.
MODEL_LAUNCH=deck
MODEL_DISPLAY_UPD=C2KNXS.UPD

# The DSP's busy-wait loop (a C6747): its head, then the range its stack
# pointer stays in there. The machine skips the loop, and the DSP module is
# generated and replayed against the same head. ISR_FAST keeps the interrupt
# handlers' stores on the core's fast paths while the skip is armed; recordings
# replay EXACT with it. GEN_ARGS are the generator options this DSP program
# needs beyond the common set in scripts/build/build_dsp_module.sh.
MODEL_DSP_IDLE=0xC004CB8C:0x11804AE0:0x11805C00
MODEL_DSP_ISR_FAST=1
MODEL_DSP_GEN_ARGS="--wide-mem --ret-predict 16"

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, then the first track of the first artist; the load starts it playing).
MODEL_IDLE_S=70
MODEL_LOAD_STEPS="sendkey u 400; wait 8; sendkey ret 400; wait 12; sendkey ret 400; wait 12; sendkey ret 400; wait 15; sendkey ret 400; wait 45"

# Pinned from the first unpack: they prove the output is reproducible, not
# that the GUI decode is right (the GUI image is not yet understood).
MODEL_EXPECTED="
extract/main_unpacked.bin 7b21d1d32ff36fb349c8556c46475cd349c982bdf76bacf339fb309af532677c
extract/gui_unpacked.bin  db8e342e06748d94f451363c9945ee9264d11f830d00ef9ff9e8fc3d9abf9ef2
"
