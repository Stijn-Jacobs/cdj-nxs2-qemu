# CDJ-2000NXS, update v1.43 -- BRING-UP. The older platform it shares with the
# CDJ-2000: an SH-4A MAIN with its peripherals at 0xFFxxxxxx (not the NXS2's
# SH7724), a C672x-class DSP and a different GUI processor. The update has the
# NXS2's container layout; MAIN's LZSS stream starts at 0x40000, not 0x50000.
# No GUI board yet: MAIN boots alone.
MODEL_TITLE="CDJ-2000NXS"
MODEL_MAIN_MACHINE=cdj2000nxs
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj2000nxs

MODEL_FW_VERSION=1.43
MODEL_UPD="C2KNXS.UPD"
MODEL_UPD_SHA256="85776fff9ea941ea8272fe2e113f002d6bdec6de71b61f49b07be1d1c4358f4b"
MODEL_MAIN_SECTION=3
MODEL_GUI_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_FW_STEPS="sections srec_coverage lzss_decode gui_decode"

# The display board (a Blackfin) runs inside the MAIN emulator and loads its
# program from this update file.
MODEL_LAUNCH=deck
MODEL_DISPLAY_UPD=C2KNXS.UPD

# Pinned from the first unpack: they prove the output is reproducible, not
# that the GUI decode is right (the GUI image is not yet understood).
MODEL_EXPECTED="
extract/main_unpacked.bin 79c6fc1c243ba4ee91ec108e98de4f0c399f3215fa904789e1315affdb470551
extract/gui_unpacked.bin  db8e342e06748d94f451363c9945ee9264d11f830d00ef9ff9e8fc3d9abf9ef2
"
