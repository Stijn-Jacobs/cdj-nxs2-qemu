# XDJ-1000, update v1.13 -- BRING-UP. The same SH7724 SoC as the CDJ-2000NXS2,
# but MAIN draws the screen itself: there is no display processor.
# Only the MAIN image is unpacked: it has no GUI section.
MODEL_TITLE="XDJ-1000"
MODEL_MAIN_MACHINE=xdj1000
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/xdj1000

MODEL_FW_VERSION=1.13
MODEL_UPD="XDJ1000.UPD"
MODEL_UPD_SHA256="2da48a1baa999e3c36f62b7b7f1732a6f4c7ca2a37f636c13b0b3cbf8de94d75"
MODEL_MAIN_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_FW_STEPS="sections srec_coverage lzss_decode"

# MAIN draws its own screen into the SH7724 LCD controller's frame buffer; the
# board shows it in its window, so one MAIN emulator is the whole player.
MODEL_LAUNCH=deck

# The DSP's busy-wait loop, as in cdj2000nxs.conf (the same C6747 program layout).
MODEL_DSP_IDLE=0xC004CD0C:0x11804AE0:0x11805C00
MODEL_DSP_ISR_FAST=1
MODEL_DSP_GEN_ARGS="--wide-mem --ret-predict 16"

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, then seven rotary pushes down to the first track, which starts playing).
MODEL_IDLE_S=45
MODEL_LOAD_STEPS="key 0x13:0x04:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; wait 30"

MODEL_EXPECTED="
extract/main_unpacked.bin edafe1acb33c078b73355f1166017485692a24f7e35041bcd736a91e7dc6831c
"
