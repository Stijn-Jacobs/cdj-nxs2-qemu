# CDJ-850, update v1.13 -- BRING-UP. Single-file flat big-endian binary flash
# image, no manifest, no S-records; the 32-byte label sits at flat 0x60000
# (see notes/cdj850-layout.md and scripts/firmware/c850_decode.py).
MODEL_TITLE="CDJ-850"
MODEL_RELEASED=2010.2
MODEL_MAIN_MACHINE=cdj850
MODEL_MAIN_ARCH=sh4eb
MODEL_MAIN_BOOT=flash
MODEL_MAIN_FLASH="flash_cdj850.bin"
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj850
MODEL_FW_VERSION=1.13
MODEL_UPD="C850MAIN.UPD"
MODEL_UPD_SHA256="12ed34539d844e4c3d9230eebccbc31f0b6ff2ac4d813455084987c53beac3b7"
MODEL_MAIN_SECTION=main
# boot_main.sh loads this as -kernel (kernel-boot models); the CDJ-850 boots
# through the bootloader in flash (MAIN_BOOT=flash), so flash_cdj850.bin is
# booted via -drive if=pflash while main_unpacked.bin serves mod inspection.
MODEL_KERNEL="main_flat.bin"
# Offset 0x60020 is the BE32 packed-MAIN length (0x60024 - 4 = 0x60020, so
# modelfw.main_off = 0x60020 when MODEL_MAIN_LZSS=0x60024).
MODEL_MAIN_LZSS=0x60024
MODEL_UPDATE_WINDOW_END=0x3F0000
# The bootloader unpacks MAIN to SDRAM at 0x0C000000 (notes/cdj850-layout.md,
# "Packed-MAIN -> SDRAM decoder map").
MODEL_MAIN_BASE=0x0C000000
MODEL_FW_STEPS="c850_raw make_flash_cdj850 c850_unpack"
MODEL_LAUNCH=deck
MODEL_APP_FACE=cdj850
MODEL_IDLE_S=15
MODEL_LOAD_STEPS="key 0x16:2:160:or; wait 3; key 0x0d:1:160:or; wait 2; key 0x04:1:0:rot; wait 2; key 0x0d:1:160:or; wait 5"

