# CDJ-850, update v1.13 -- BRING-UP. Single-file flat big-endian binary flash
# image, no manifest, no S-records; the 32-byte label sits at flat 0x60000
# (see notes/cdj850-layout.md and scripts/firmware/c850_decode.py).
MODEL_TITLE="CDJ-850"
MODEL_RELEASED=2010.2
MODEL_MAIN_MACHINE=cdj850
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj850
MODEL_FW_VERSION=1.13
MODEL_UPD="C850MAIN.UPD"
MODEL_UPD_SHA256="12ed34539d844e4c3d9230eebccbc31f0b6ff2ac4d813455084987c53beac3b7"
MODEL_MAIN_SECTION=main
# boot_main.sh loads this as -kernel (kernel-boot models); the CDJ-850 boots
# through the bootloader in flash (MAIN_BOOT=flash), so this file only proves
# the firmware was prepared. The flash image itself is assembled locally by
# scripts/firmware/make_flash_cdj850.py from the two files below.
MODEL_KERNEL="main_flat.bin"
# Unused by the c850_raw step (no LZSS stream in this container); set only
# because the profile loaders (launcher/model.py, scripts/cdj_model.sh)
# require it.
MODEL_MAIN_LZSS=0x0
MODEL_FW_STEPS="c850_raw"
MODEL_LAUNCH=deck

MODEL_EXPECTED="
extract/main_flat.bin 51457aadf771fb7027569df8e3def364f0e456c7a2af2ec03a51b43efbd5c2de
"
