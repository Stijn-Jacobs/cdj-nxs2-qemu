# XDJ-1000MK2, update v1.45 -- BRING-UP. The SH7724 board of the XDJ-1000: MAIN
# draws the screen itself and there is no display processor. Only MAIN is
# unpacked (image at NOR 0x40000); extract/xdj1000mk2 holds the decoded image.
MODEL_TITLE="XDJ-1000MK2"
MODEL_RELEASED=2017.1
MODEL_MAIN_MACHINE=xdj1000mk2
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/xdj1000mk2

MODEL_FW_VERSION=1.45
MODEL_UPD="XDJ1KMK2.UPD"
MODEL_UPD_SHA256="6fd2a5002b297b86fb8a5931d3debf1b607ff6abaf9d49cd737d3a530002dbcd"
MODEL_MAIN_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_MAIN_BASE=0x08000000
# The updater's MAIN erase table ends at 0x40000 + 118 * 128 KiB sectors.
MODEL_UPDATE_WINDOW_END=0xf00000
MODEL_FW_STEPS="sections srec_coverage lzss_decode"

# The XDJ-1000's board: MAIN draws its own screen, so one MAIN emulator is
# the whole player.
MODEL_LAUNCH=deck

# The virtual deck app (./start.sh --app) draws this player from app/faces/.
MODEL_APP_FACE=xdj1000mk2

# The DSP's busy-wait loop, as in xdj1000.conf: the same C6747 program, its state
# machine loop sits at a different address in this firmware.
MODEL_DSP_IDLE=0xC004EDCC:0x11804AE0:0x11805C00
MODEL_DSP_ISR_FAST=1
MODEL_DSP_MHZ=150
MODEL_DSP_GEN_ARGS="--wide-mem --ret-predict 16"
# What the module still leaves to the interpreter goes into m.extra.so, built
# from the training play's own profile: MP3 play and MASTER TEMPO need about
# 6 pct less host time with it, and a recorded run replays exactly.
MODEL_DSP_LEFTOVER_ARGS="--wide-mem --ret-predict 16 --roots 1500 --min 30000 --nodes 400 --kernels 16 --loops 16 --lmin 0 --cold 1000 --qroots 160 --qmin 4000"

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, two turns of the select knob down to [TRACK], then two pushes: open the
# list and load its first track, which starts playing).
#
# The steps go to [TRACK] rather than pushing down [ARTIST] because a library
# whose files carry no artist/album tags is filed under UnknownArtist/UnknownAlbum,
# and the deck lists no unknown artist, so the ARTIST pane is empty and the
# pushes never load. [TRACK] is always populated. The knob is report byte 0x0E,
# as on the CDJ-2000NXS.
MODEL_IDLE_S=45
MODEL_LOAD_STEPS="key 0x13:0x04:300; wait 12; key 0x0e:1:0:rot; wait 3; key 0x0e:1:0:rot; wait 3; key 0x11:0x01:300; wait 12; key 0x11:0x01:300; wait 45"

# What the module-building profile play does once the track plays: MASTER TEMPO
# on, so the module covers the time-stretch code too.
MODEL_PROFILE_STEPS="key 0x14:0x04:300; wait 20"

MODEL_EXPECTED="
extract/main_unpacked.bin 16928d8c34df9b22e51eb284eb003303690546f37ea3615e6b601b1e96b77571
"
