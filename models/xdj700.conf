# XDJ-700, update v1.15 -- BRING-UP. The SH7724 board of the XDJ-1000: MAIN
# draws the screen itself and there is no display processor. Only MAIN is
# unpacked (image at NOR 0x40000); extract/xdj700 holds the decoded image.
MODEL_TITLE="XDJ-700"
MODEL_RELEASED=2015.1
MODEL_MAIN_MACHINE=xdj700
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/xdj700

MODEL_FW_VERSION=1.15
MODEL_UPD="XDJ700.UPD"
MODEL_UPD_SHA256="73edec9802da51672257c2599efc04209dc92478fcbaa1a0425b3b122e33f99c"
MODEL_MAIN_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_FW_STEPS="sections srec_coverage lzss_decode"

# MAIN draws its own screen into the SH7724 LCD controller's frame buffer; the
# board shows it in its window, so one MAIN emulator is the whole player.
MODEL_LAUNCH=deck

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, then seven rotary pushes down to the first track, which starts playing).
MODEL_IDLE_S=45
MODEL_LOAD_STEPS="key 0x13:0x04:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; key 0x11:0x01:300; wait 8; wait 30"

MODEL_EXPECTED="
extract/main_unpacked.bin 17c39e915a661ff776a1bd538b132050919e7035fce7d0969648d79b035388cb
"
