# CDJ-2000, update v4.33 -- BRING-UP. The same platform as the CDJ-2000NXS
# (see cdj2000nxs.conf). Its update is four separate files, one per section,
# in the NXS container's section order: GUI, DRIV, MAIN, PANL.
# No GUI board yet: MAIN boots alone.
MODEL_TITLE="CDJ-2000"
MODEL_RELEASED=2009.1
MODEL_MAIN_MACHINE=cdj2000
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj2000

MODEL_FW_VERSION=4.33
MODEL_UPD="C2KGUI.UPD C2KDRIV.UPD C2KMAIN.UPD C2KPANL.UPD"
MODEL_UPD_SHA256="93d59ab81ece45e684a6d1228cf6b5a557a53e0baf29dfb03725ab1ef2b20c78 fcd8005ac87302e22b9bff979fabc08a1bf353d9430b249b5011580845255ace 49f7efcd08e5eae3678a438d3af49e03608aacb11838180fa67faa81132c11fb c07dd5e9f0db38c914b224f55c87f383ccd271098a334eadf3bdea7559032cf4"
MODEL_MAIN_SECTION=3
MODEL_GUI_SECTION=1
MODEL_MAIN_LZSS=0x40004
MODEL_FW_STEPS="sections srec_coverage lzss_decode gui_decode"

# The display board (a Blackfin) runs inside the MAIN emulator and loads its
# program from this update file.
MODEL_LAUNCH=deck
MODEL_DISPLAY_UPD=C2KGUI.UPD

# The DSP's busy-wait loop (a C6727; the CDJ-2000NXS and the XDJ-1000 have a
# C6747 and name theirs in CDJ_C6747_IDLE): its head, then the range its stack
# pointer stays in there. The machine skips the loop, and the DSP module is
# generated and replayed against the same head. The firmware decodes MP3 in an
# interrupt handler with interrupts disabled, so the generator needs more
# roots and a deeper return predictor than the C6747 decks.
MODEL_DSP_IDLE=0x80047B80:0x10005000:0x10006600
MODEL_DSP_IDLE_KNOB=CDJ_C6727_IDLE
MODEL_DSP_ISR_FAST=1
# The routine the machine returns from at once (its hook on control register 9); a replay
# has no hook, and runs into instructions the core lacks without this.
MODEL_DSP_RETURN_AT=0x8004CDA0
MODEL_DSP_GEN_ARGS="--roots 2600 --min 5000 --qroots 200 --qmin 10000 --cold 1000 --wide-mem --ret-predict 400"

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, then the first track of the first artist; the load starts it playing).
MODEL_IDLE_S=60
MODEL_LOAD_STEPS="sendkey u 400; wait 8; sendkey ret 400; wait 12; sendkey ret 400; wait 12; sendkey ret 400; wait 15; sendkey ret 400; wait 45"

# Pinned from the first unpack: they prove the output is reproducible, not
# that the GUI decode is right (the GUI image is not yet understood).
MODEL_EXPECTED="
extract/main_unpacked.bin fad973f687341e2a246f8b8d3ffa79cfa685d15164a5bc596ca93bc73418bb5c
extract/gui_unpacked.bin  8ea5ded1bcff0d83c6957350ca81d992ea85b9c65fee560458f16605bb859562
