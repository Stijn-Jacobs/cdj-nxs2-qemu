# SPDX-License-Identifier: GPL-2.0-or-later
# CDJ-900NXS, update v1.31 -- BRING-UP. The SH7724 board of the XDJ-1000: MAIN
# draws the screen itself and there is no display processor. Only MAIN is
# unpacked (image at NOR 0x40000); extract/cdj900nxs holds the decoded image.
MODEL_TITLE="CDJ-900NXS"
MODEL_RELEASED=2013.1
MODEL_MAIN_MACHINE=cdj900nxs
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj900nxs

MODEL_FW_VERSION=1.31
MODEL_UPD="C900NXS.UPD"
MODEL_UPD_SHA256="e96bca7d1ac983985992a8e5fa7813e1ebf04bef514e0c6cfd0a8375f667f7f9"
MODEL_MAIN_SECTION=2
MODEL_MAIN_LZSS=0x40004
MODEL_MAIN_BASE=0x08000000
# The updater's MAIN erase table ends at 0x40000 + 122 * 64 KiB sectors.
MODEL_UPDATE_WINDOW_END=0x7e0000
MODEL_FW_STEPS="sections srec_coverage lzss_decode"

# MAIN draws its own screen into the SH7724 LCD controller's frame buffer; the
# board shows it in its window, so one MAIN emulator is the whole player.
MODEL_LAUNCH=deck

# The virtual deck app (./start.sh --app) draws this player from app/faces/.
MODEL_APP_FACE=cdj900nxs

# The DSP's busy-wait loop, as in xdj1000.conf: the same C6747 program, its state
# machine loop sits at a different address in this firmware.
MODEL_DSP_IDLE=0xC004CD0C:0x11804AE0:0x11805C00
MODEL_DSP_ISR_FAST=1
MODEL_DSP_GEN_ARGS="--wide-mem --ret-predict 16"

# Snapshots (SNAPSHOT=idle|loaded on a deck start): the deck is saved 'idle'
# this many seconds after power-on, and 'loaded' after these steps from there
# (USB, two turns of the select knob down to [TRACK], then two pushes: open the
# list and load its first track, which starts playing).
#
# The steps go to [TRACK] rather than pushing down [ARTIST] because a library
# whose files carry no artist/album tags is filed under UnknownArtist/UnknownAlbum,
# and the deck lists no unknown artist, so the ARTIST pane is empty and the
# pushes never load. [TRACK] is always populated. The knob is report byte 0x0E,
# as on the CDJ-2000NXS.
MODEL_IDLE_S=45
MODEL_LOAD_STEPS="key 0x13:0x04:300; wait 12; key 0x0e:1:0:rot; wait 3; key 0x0e:1:0:rot; wait 3; key 0x11:0x01:300; wait 12; key 0x11:0x01:300; wait 45"

# What the module-building profile play does once the track plays: MASTER TEMPO
# on, the tempo slider off centre, so the module covers the time-stretch code too.
MODEL_PROFILE_STEPS="key 0x04:200:0:lvl; wait 4; key 0x15:0x10:300; wait 10; key 0x04:60:0:lvl; wait 10"

MODEL_EXPECTED="
extract/main_unpacked.bin 7c2f9dc89507599b7de645e43c5e94b8dcb23b2f1a1ce325863b5f722057ff26
"
