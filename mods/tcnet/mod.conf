MOD_ENV=CDJ_MAIN_TCNET+CDJ_MAIN_TCNETTIME+CDJ_MAIN_TCNETDATA
MOD_ON=1
MOD_OFF=0
MOD_DEFAULT=off
MOD_MODELS=cdj2000nxs2
MOD_DESCRIPTION="Act as a TCNet Master node: broadcast Opt-IN and Status once a second (UDP 60000) and Time packets every 20 ms (UDP 60001) with the deck's play position, track length, beat in the bar and play state, and answer Metrics (BPM, speed, sync master) and MetaData requests on UDP 65023, so ShowKontrol, Resolume or other TCNet receivers can follow it"
