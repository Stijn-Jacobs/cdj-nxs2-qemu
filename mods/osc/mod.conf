MOD_ENV=CDJ_MAIN_OSC+CDJ_MAIN_OSCBEAT
MOD_ON=1
MOD_OFF=0
MOD_DEFAULT=off
MOD_MODELS=cdj2000nxs2
MOD_DESCRIPTION="Send the deck's beats and state as OSC messages (/cdj/<player>/beat, bar, timing, playing, state, loaded, end, master, sync, masterdeck, track, and load, play, stop, cue, loop when they happen; UDP broadcast port 50010), for lighting desks and scripts"
MOD_BROWSER=no
