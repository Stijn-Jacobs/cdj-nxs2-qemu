# The mods registry: every on/off tweak to how the deck behaves, in one place.
# Setup asks about each row and saves the choice to cdj.conf; start applies
# it; the rig falls back to the row's own default when nothing else set the
# knob. Add a row here to add a mod everywhere at once. A mod that patches the
# display firmware also needs its routine in patch_gui.py; its knob
# is CDJ_GUI_<NAME>, with on = 1. A mod that patches MAIN likewise needs an
# entry in patch_main.py, knob CDJ_MAIN_<NAME>. A mod that patches both
# images under one on/off choice (their registry keys need not match) joins
# the two knobs with '+' in the env field, e.g. CDJ_GUI_WAVE3+CDJ_MAIN_WAVE3;
# the choice is still saved once, under the first knob.
#
#   key|env|on|off|default|description
#
#   key          short id, used for the setup prompt
#   env          the CDJ_* (or plain) knob the board actually reads, or
#                several '+'-joined for a mod that spans more than one image
#   on / off     the value that knob gets when the mod is enabled/disabled
#   default      "on" or "off": what a fresh install ships with
#   description  one line, asked as "<description>?" at setup and shown in
#                the README's Mods section
#
# cdj.conf keeps each choice under CDJ_<ENV> (already true for env names that
# start with CDJ_). SERVICE MODE is not here: it is a boot option (--service /
# CDJ_SERVICE), not a behaviour change, and setup does not ask about it.
high_fps|CDJ_GUI_FRAME_MS|6|0|on|Draw the zoomed-in waveform about twice as often (~70 fps instead of ~33)
live_clock|CDJ_GUI_CLOCK_DT|43|0|on|Repaint the REMAIN clock every frame instead of about three times a second
three_band|CDJ_GUI_WAVE3+CDJ_GUI_WAVE3OV+CDJ_MAIN_WAVE3DATA+CDJ_MAIN_WAVE3DETAIL+CDJ_MAIN_WAVE3OVFETCH+CDJ_MAIN_WAVE3OVDATA|1|0|off|Draw the centre waveform and the overview as three bands (low blue, mid amber, high white), CDJ-3000 style, from the track's own 3-band data (.2EX); tracks without it keep the stock colours
osc|CDJ_MAIN_OSC+CDJ_MAIN_OSCBEAT|1|0|off|Send the deck's beats and state as OSC messages (/cdj/<player>/beat, bar, timing, playing, state, loaded, end, master, sync, masterdeck, track, and load, play, stop, cue, loop when they happen; UDP broadcast port 50010), for lighting desks and scripts
usb_midi|CDJ_MAIN_USBMIDI+CDJ_MAIN_USBMIDITICK|1|0|off|Send MIDI Start, Stop, Continue and 24 Timing Clocks per beat from the deck's play state and BPM over the rear USB-B MIDI port, so a DAW or drum machine follows the deck
ableton_link|CDJ_MAIN_ABLETONLINK+CDJ_MAIN_ABLETONLINKPONG|1|0|off|Join Ableton Link as a peer: Live or any Link app on the deck's network follows its tempo and beat, announced on UDP 20808 at every beat and measured against the Pro DJ Link socket
